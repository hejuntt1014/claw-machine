<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#140b22" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>3D 夹娃娃机</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>" />
</head>
<body class="intro">
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="top">
      <div class="pill" id="coins"><span>🪙</span><b>10</b></div>
      <div class="pill" id="timer"><i id="ring"></i><b>--</b><span class="unit">秒</span></div>
      <button class="pill" id="bag"><span>🧸</span><b>0</b></button>
    </div>
    <div class="tools">
      <button id="snd" aria-label="声音">🔊</button>
      <button id="cam" aria-label="视角">🎥</button>
      <button id="q" aria-label="画质">中</button>
    </div>
    <div id="status"></div>
    <div id="toast"></div>
    <div class="bottom">
      <div id="joy"><div class="arrows"><i>▲</i><i>▶</i><i>▼</i><i>◀</i></div><div id="knob"></div></div>
      <button id="insert">投币开始<small>1 币 / 局</small></button>
      <button id="grab">抓!</button>
    </div>
  </div>
  <div id="drawer" class="hidden">
    <div class="panel">
      <h2>我的战利品</h2>
      <div id="bagList"></div>
      <button id="closeBag">关闭</button>
    </div>
  </div>
  <div id="win">
    <div class="card">
      <div class="badge">🎉 恭喜获得 <span id="winEmoji"></span></div>
      <div class="name" id="winName"></div>
      <div class="wsub" id="winSub"></div>
      <button id="winOk">收下!</button>
    </div>
  </div>
  <div id="start">
    <div class="intro">
      <div class="tag">ARCADE · 3D · 真实物理</div>
      <h1><span>夹</span><span>娃</span><span>娃</span></h1>
      <p class="sub">毛绒娃娃软乎乎 · 爪力随机像真机 · 掉进出口就归你</p>
      <div class="bar"><div id="bar"></div></div>
      <p id="loadTxt">正在加载…</p>
      <button id="go" disabled>开始游戏</button>
      <ul class="help">
        <li><b>🕹️</b>左下摇杆 / 方向键 移动爪子</li>
        <li><b>🔴</b>点「抓!」或空格 下爪</li>
        <li><b>👆</b>拖动旋转视角 · 双指缩放 · 🎥 切换侧视</li>
      </ul>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
