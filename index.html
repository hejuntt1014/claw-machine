<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#fdf6f9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>爪爪乐 · PAW PLAY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23f47aa8'/><circle cx='16' cy='14' r='9' fill='%23fff'/><circle cx='12' cy='13' r='1.6' fill='%23222'/><circle cx='20' cy='13' r='1.6' fill='%23222'/><path d='M12 18q4 4 8 0' stroke='%23222' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>" />
</head>
<body class="intro">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.5 9.5h3.75a1.75 1.75 0 0 1 0 3.5h-2.5a1.75 1.75 0 0 0 0 3.5H14.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M3 9h18M12 9v11M12 9c-2-4-6-4-6-1.5S10 9 12 9zm0 0c2-4 6-4 6-1.5S14 9 12 9z"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="w" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/><path class="x" d="M16 9.5l4.5 5M20.5 9.5l-4.5 5"/></symbol>
    <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8.5h3l1.8-2h6.4l1.8 2h3V18H4z"/><circle cx="12" cy="13" r="3.2"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V5a1.5 1.5 0 0 1 3 0v6M14 11V6.5a1.5 1.5 0 0 1 3 0V14c0 3.5-2.5 6-6 6s-5-2-6.5-4.5L3 13a1.5 1.5 0 0 1 2.5-1.5L8 14"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.2v.3"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M6 20h12"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="11" rx="2"/><path d="M6.5 10h1M10 10h1M13.5 10h1M17 10h.5M8 14h8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
  </defs>
</svg>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="board">
      <div class="stats">
        <div class="stat" id="coins" title="剩余游戏币"><svg class="ic"><use href="#i-coin"/></svg><b>10</b></div>
        <div class="stat" id="timer" title="本局剩余时间"><svg class="ic"><use href="#i-clock"/></svg><b>--</b></div>
        <button class="stat btn" id="bag" title="我的奖品" aria-label="我的奖品"><svg class="ic"><use href="#i-gift"/></svg><b>0</b></button>
      </div>
      <div class="tools">
        <button class="tool btn" id="cam" title="换角度（V）" aria-label="换角度"><svg><use href="#i-cam"/></svg></button>
        <button class="tool btn" id="set" title="设置" aria-label="设置" aria-expanded="false"><svg><use href="#i-gear"/></svg></button>
        <button class="tool btn" id="fs" title="全屏（F）" aria-label="全屏"><svg><use href="#i-full"/></svg></button>
      </div>
    </div>
    <div id="settings" class="pop" role="dialog" aria-label="设置">
      <div class="row"><span class="lbl">机台配色</span><div class="chips" id="themes"></div></div>
      <div class="row"><span class="lbl">画质</span><div class="seg" id="qseg"><button class="btn" data-q="0">低</button><button class="btn" data-q="1">中</button><button class="btn" data-q="2">高</button></div></div>
      <div class="row"><span class="lbl">声音</span><button class="switch btn" id="snd" role="switch" aria-checked="true" aria-label="声音"><i></i></button></div>
      <div class="row links"><button class="link btn" id="replayGuide">重看新手引导</button><button class="link btn fine-only" id="showKeys">按键说明</button></div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div id="deck">
      <div class="side l">
        <div class="keys" id="keys">
          <div class="keys-hd"><svg class="ic"><use href="#i-key"/></svg><span>键盘操作</span><button class="x btn" id="keysClose" title="收起" aria-label="收起"><svg><use href="#i-close"/></svg></button></div>
          <div class="kr"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><em>移动爪子</em></div>
          <div class="kr"><span><kbd class="wide">空格</kbd></span><em>下爪</em></div>
          <div class="kr"><span><kbd>Enter</kbd></span><em>投币</em></div>
          <div class="kr"><span><kbd>V</kbd></span><em>换角度</em></div>
          <p>鼠标拖动旋转 · 滚轮缩放</p>
        </div>
        <div id="joy" title="拖动移动爪子"><div class="ring"><i class="ar n"></i><i class="ar e"></i><i class="ar s"></i><i class="ar w"></i></div><div id="knob"></div></div>
      </div>
      <div class="side r">
        <div id="hint" class="hint"><span class="dot"></span><span id="hintTxt">投币开始游戏</span></div>
        <div class="acts">
          <button class="btn" id="insert" title="投币（Enter）"><span class="coin"><svg><use href="#i-coin"/></svg></span><span class="t"><em>投币</em><small>1 币 / 局</small></span></button>
          <button class="btn" id="grab" title="下爪（空格）" aria-label="下爪"><span class="cap"><svg><use href="#i-down"/></svg></span><em>下爪</em></button>
        </div>
      </div>
    </div>
  </div>

  <div id="drawer" class="modal hidden" role="dialog" aria-label="我的奖品">
    <div class="panel">
      <div class="panel-hd"><h2>我的奖品</h2><span id="bagTotal" class="pill"></span><button class="x btn" id="closeBag" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
      <div id="bagList" class="grid"></div>
    </div>
  </div>

  <div id="nocoin" class="modal hidden" role="dialog" aria-label="币用完了">
    <div class="panel small">
      <div class="badge"><svg><use href="#i-coin"/></svg></div>
      <h2>币用完啦</h2>
      <p>今日免费补给：领取 10 个游戏币继续玩</p>
      <button class="primary btn" id="claim">领取 10 币</button>
      <button class="ghost btn" id="later">稍后</button>
    </div>
  </div>

  <div id="win" role="dialog" aria-label="出奖">
    <div class="wcard">
      <canvas id="winPrev" width="240" height="240"></canvas>
      <div class="winfo">
        <span class="tag">出奖啦</span>
        <div class="name" id="winName"></div>
        <div class="wsub" id="winSub"></div>
      </div>
      <button class="primary btn" id="winOk">从取物口取出</button>
    </div>
  </div>

  <div id="onboard" class="modal hidden" role="dialog" aria-label="新手引导">
    <div class="panel guide">
      <div class="steps">
        <div class="step on"><div class="art a1"><div class="mini-joy"><i></i></div></div><h3>移动爪子</h3><p>拖动左下摇杆，把爪子移到娃娃正上方</p></div>
        <div class="step"><div class="art a2"><div class="mini-btn"></div></div><h3>按下爪</h3><p>对准后按红色按钮，爪子会下降抓取</p></div>
        <div class="step"><div class="art a3"><div class="mini-ring">PRIZE<br>OUT</div></div><h3>掉进出口就中奖</h3><p>娃娃落入左前方出口，从取物口拿走</p></div>
      </div>
      <div class="guide-ft"><div class="dots"><i class="on"></i><i></i><i></i></div><button class="ghost btn" id="obSkip">跳过</button><button class="primary btn" id="obNext">下一步</button></div>
    </div>
  </div>

  <div id="start">
    <div class="sheet">
      <div class="brand"><span class="blob"><i></i><i></i></span><div><h1>爪爪乐</h1><p class="en">PAW PLAY · 线上娃娃机</p></div></div>
      <div class="offer"><svg class="ic"><use href="#i-gift"/></svg><span>新玩家赠送 <b>10</b> 币 · 1 币 1 局</span></div>
      <div class="loading"><div class="bar"><div id="bar"></div></div><p id="loadTxt">正在加载…</p></div>
      <button class="primary btn big" id="go" disabled>开始游戏</button>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
