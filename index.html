<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f47aa8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>爪爪乐 · PAW PLAY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23f47aa8'/><circle cx='16' cy='14' r='9' fill='%23fff'/><circle cx='12' cy='13' r='1.6' fill='%23222'/><circle cx='20' cy='13' r='1.6' fill='%23222'/><path d='M12 18q4 4 8 0' stroke='%23222' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>" />
</head>
<body class="intro">
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="board">
      <div class="card lcd" id="coins"><label>币</label><b>10</b></div>
      <div class="card lcd" id="timer"><label>时间</label><b>--</b></div>
      <button class="card lcd" id="bag" aria-label="我的奖品"><label>奖品</label><b>0</b></button>
      <div class="themes" id="themes" aria-label="机台配色"></div>
      <div class="tools">
        <button id="snd" aria-label="声音"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg></button>
        <button id="cam" aria-label="换角度"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button id="q" aria-label="画质">中</button>
        <button id="fs" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </div>
    </div>
    <div id="status"></div>
    <div id="toast"></div>
    <div id="deck">
      <div class="side l">
        <div class="keys" aria-hidden="true">
          <div><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd></span><em>移动</em></div>
          <div><span><kbd class="wide">空格</kbd></span><em>下爪</em></div>
          <div><span><kbd>Enter</kbd> / <kbd>C</kbd></span><em>投币</em></div>
          <div><span><kbd>V</kbd> / <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></span><em>视角</em></div>
          <div><span><kbd>M</kbd> <kbd>F</kbd></span><em>静音 · 全屏</em></div>
          <p>拖动鼠标换角度，滚轮缩放</p>
        </div>
        <div id="joy"><div class="ring"></div><div id="knob"></div></div>
      </div>
      <div class="side r">
        <button id="insert"><em>投币</em><small>1币1局</small></button>
        <button id="grab"><span class="cap"></span><em>下爪</em></button>
      </div>
    </div>
  </div>
  <div id="drawer" class="hidden">
    <div class="panel">
      <h2>我的奖品</h2>
      <div id="bagList"></div>
      <button id="closeBag">关闭</button>
    </div>
  </div>
  <div id="win">
    <div class="card">
      <div class="hd"><span>出奖</span><span id="winNo"></span></div>
      <div class="name" id="winName"></div>
      <div class="wsub" id="winSub"></div>
      <button id="winOk">取出</button>
    </div>
  </div>
  <div id="start">
    <div class="sheet">
      <div class="brand"><span class="blob"></span><div><h1>爪爪乐</h1><p class="en">PAW PLAY</p></div></div>
      <p class="sub">1 币 1 局 · 新玩家送 10 币</p>
      <div class="bar"><div id="bar"></div></div>
      <p id="loadTxt">正在加载…</p>
      <button id="go" disabled>开始</button>
      <ol class="help">
        <li>左下摇杆移动爪子（电脑可用方向键）</li>
        <li>按红色按钮下爪（空格键）</li>
        <li>拖动画面换角度，双指缩放</li>
      </ol>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
