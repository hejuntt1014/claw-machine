<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#18171a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>抓娃娃</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23c4362c'/><path d='M16 6v8M10 22l6-8 6 8' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/></svg>" />
</head>
<body class="intro">
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="board">
      <div class="seg" id="coins"><label>币</label><div class="digits"></div></div>
      <div class="seg" id="timer"><label>时间</label><div class="digits"></div></div>
      <button class="seg" id="bag" aria-label="我的奖品"><label>奖品</label><div class="digits"></div></button>
      <div class="tools">
        <button id="snd" aria-label="声音"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg></button>
        <button id="cam" aria-label="换角度"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button id="q" aria-label="画质">中</button>
      </div>
    </div>
    <div id="status"></div>
    <div id="toast"></div>
    <div id="deck">
      <div id="joy"><div class="plate"><i></i><i></i><i></i><i></i></div><div class="washer"></div><div id="knob"></div></div>
      <button id="insert"><span class="slot"></span><em>投币</em><small>1币1局</small></button>
      <button id="grab"><span class="ring"><span class="cap"></span></span><em>下爪</em></button>
    </div>
  </div>
  <div id="drawer" class="hidden">
    <div class="panel">
      <h2>我的奖品</h2>
      <div id="bagList"></div>
      <button id="closeBag">关闭</button>
    </div>
  </div>
  <div id="win">
    <div class="card">
      <div class="hd"><span>出奖</span><span id="winNo"></span></div>
      <div class="name" id="winName"></div>
      <div class="wsub" id="winSub"></div>
      <button id="winOk">取出</button>
    </div>
  </div>
  <div id="start">
    <div class="sheet">
      <h1>抓娃娃</h1>
      <p class="sub">1 币 1 局 · 新玩家送 10 币</p>
      <div class="bar"><div id="bar"></div></div>
      <p id="loadTxt">正在加载…</p>
      <button id="go" disabled>开始</button>
      <ol class="help">
        <li>左下摇杆移动爪子（电脑可用方向键）</li>
        <li>按红色按钮下爪（空格键）</li>
        <li>拖动画面换角度，双指缩放</li>
      </ol>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
